[project]
name = "complaint-extraction"
version = "0.1.0"
description = "Extract structured facts from consumer complaint text with a small fine-tuned LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasketch>=2.0.0",
    "duckdb>=2.0.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
ml = [
    "accelerate>=1.16.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "peft>=0.22.0",
    "torch>=2.15.0",
    "transformers>=5.24.0",
    "uvicorn>=0.54.0",
]
